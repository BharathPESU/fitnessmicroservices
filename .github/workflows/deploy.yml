name: Fitness CI/CD to AWS ECR and EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

jobs:
  # ============================================================================
  # 1. BUILD JARS, REACT FRONTEND, BUILD DOCKER IMAGES & PUSH TO AMAZON ECR
  # ============================================================================
  build-and-push-ecr:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fitness-frontend/package-lock.json

      # ------------------------------------------------------------------------
      # Maven Package Backend Microservices
      # ------------------------------------------------------------------------
      - name: Package Config Server
        run: |
          chmod +x ./configserver/configserver/mvnw
          ./configserver/configserver/mvnw -f ./configserver/configserver/pom.xml clean package -DskipTests

      - name: Package Eureka Server
        run: |
          chmod +x ./eureka/eureka/mvnw
          ./eureka/eureka/mvnw -f ./eureka/eureka/pom.xml clean package -DskipTests

      - name: Package User Service
        run: |
          chmod +x ./userservice/userservice/mvnw
          ./userservice/userservice/mvnw -f ./userservice/userservice/pom.xml clean package -DskipTests

      - name: Package Activity Service
        run: |
          chmod +x ./activityservice/activityservice/mvnw
          ./activityservice/activityservice/mvnw -f ./activityservice/activityservice/pom.xml clean package -DskipTests

      - name: Package AI Service
        run: |
          chmod +x ./aiservice/aiservice/mvnw
          ./aiservice/aiservice/mvnw -f ./aiservice/aiservice/pom.xml clean package -DskipTests

      - name: Package API Gateway
        run: |
          chmod +x ./gateway/gateway/mvnw
          ./gateway/gateway/mvnw -f ./gateway/gateway/pom.xml clean package -DskipTests

      # ------------------------------------------------------------------------
      # Build Frontend (Vite -> dist)
      # ------------------------------------------------------------------------
      - name: Build React Frontend
        run: |
          cd fitness-frontend
          npm ci
          npm run build

      # ------------------------------------------------------------------------
      # AWS Authentication & Amazon ECR Login
      # ------------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------------------
      # Ensure ECR Repositories Exist (Auto-Provision if missing)
      # ------------------------------------------------------------------------
      - name: Ensure ECR Repositories Exist
        run: |
          REPOS=("fitness-configserver" "fitness-eureka" "fitness-userservice" "fitness-activityservice" "fitness-aiservice" "fitness-gateway" "fitness-frontend")
          for repo in "${REPOS[@]}"; do
            aws ecr describe-repositories --repository-names "$repo" --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name "$repo" --region ${{ env.AWS_REGION }}
          done

      # ------------------------------------------------------------------------
      # Build, Tag & Push Docker Images to Amazon ECR
      # ------------------------------------------------------------------------
      - name: Build & Push Docker Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Target ECR Registry: $ECR_REGISTRY"

          # 1. Config Server
          docker build -t $ECR_REGISTRY/fitness-configserver:latest ./configserver/configserver
          docker push $ECR_REGISTRY/fitness-configserver:latest

          # 2. Eureka Server
          docker build -t $ECR_REGISTRY/fitness-eureka:latest ./eureka/eureka
          docker push $ECR_REGISTRY/fitness-eureka:latest

          # 3. User Service
          docker build -t $ECR_REGISTRY/fitness-userservice:latest ./userservice/userservice
          docker push $ECR_REGISTRY/fitness-userservice:latest

          # 4. Activity Service
          docker build -t $ECR_REGISTRY/fitness-activityservice:latest ./activityservice/activityservice
          docker push $ECR_REGISTRY/fitness-activityservice:latest

          # 5. AI Service
          docker build -t $ECR_REGISTRY/fitness-aiservice:latest ./aiservice/aiservice
          docker push $ECR_REGISTRY/fitness-aiservice:latest

          # 6. API Gateway
          docker build -t $ECR_REGISTRY/fitness-gateway:latest ./gateway/gateway
          docker push $ECR_REGISTRY/fitness-gateway:latest

          # 7. React Frontend
          docker build -t $ECR_REGISTRY/fitness-frontend:latest ./fitness-frontend
          docker push $ECR_REGISTRY/fitness-frontend:latest

  # ============================================================================
  # 2. DEPLOY ALL SERVICES VIA DOCKER COMPOSE TO AWS EC2
  # ============================================================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code (for compose files)
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Ensure Docker & Docker Compose on EC2
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          TARGET_HOST=$(echo "$RAW_HOST" | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]"')
          TARGET_USER=$(echo "$RAW_USER" | tr -d '[:space:]"')

          if [ -z "$TARGET_HOST" ]; then
            echo "::error::EC2_HOST secret is empty or missing! Please check GitHub Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo "Ensuring Docker and Docker Compose are installed on $TARGET_USER@$TARGET_HOST ..."
          ssh $SSH_OPTS $TARGET_USER@$TARGET_HOST << 'EOF'
            set -e

            # Wait for package manager lock if instance recently started
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
              echo "Waiting for background package manager lock..."
              sleep 3
            done

            if ! command -v docker &> /dev/null; then
              echo ">>> Docker not found on EC2. Installing docker.io..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            else
              echo ">>> Docker is already installed: $(docker --version)"
            fi

            if ! docker compose version &> /dev/null; then
              echo ">>> Docker Compose plugin not found. Installing docker-compose-v2..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-v2 || sudo apt-get install -y docker-compose-plugin || sudo apt-get install -y docker-compose
            else
              echo ">>> Docker Compose is already installed: $(docker compose version)"
            fi

            # Ensure Docker daemon is active and user has socket access
            sudo systemctl start docker || true
            sudo usermod -aG docker $USER || true
            sudo chmod 666 /var/run/docker.sock || true
          EOF

      - name: Prepare EC2 App Directory & Sync Manifests
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          TARGET_HOST=$(echo "$RAW_HOST" | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]"')
          TARGET_USER=$(echo "$RAW_USER" | tr -d '[:space:]"')

          if [ -z "$TARGET_HOST" ]; then
            echo "::error::EC2_HOST secret is empty or missing! Please check GitHub Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo "Connecting to $TARGET_USER@$TARGET_HOST ..."
          ssh $SSH_OPTS $TARGET_USER@$TARGET_HOST "mkdir -p ~/fitness-app/keycloak"
          scp $SSH_OPTS docker-compose.prod.yml $TARGET_USER@$TARGET_HOST:~/fitness-app/docker-compose.prod.yml
          scp $SSH_OPTS keycloak/realm-export.json $TARGET_USER@$TARGET_HOST:~/fitness-app/keycloak/realm-export.json

      - name: Authenticate EC2 Docker with Amazon ECR & Launch Containers
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          TARGET_HOST=$(echo "$RAW_HOST" | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]"')
          TARGET_USER=$(echo "$RAW_USER" | tr -d '[:space:]"')
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          # 1. Determine exact ECR registry URL
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "Using ECR Registry: $ECR_REGISTRY"

          # 2. Obtain temporary ECR docker login password from AWS in the runner
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})

          ssh $SSH_OPTS $TARGET_USER@$TARGET_HOST << EOF
            set -e
            cd ~/fitness-app

            # Ensure docker socket is accessible
            sudo chmod 666 /var/run/docker.sock 2>/dev/null || true

            # Clear any corrupted Docker credentials from previous failed attempts
            rm -f ~/.docker/config.json

            # Log in EC2 Docker daemon ONLY to Amazon ECR
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Write runtime environment variables
            echo "REGISTRY_PREFIX=${ECR_REGISTRY}/" > .env
            echo "IMAGE_TAG=latest" >> .env
            echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN || 'admin' }}" >> .env
            echo "KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD || secrets.DB_PASSWORD }}" >> .env
            echo "FRONTEND_PORT=${{ secrets.FRONTEND_PORT || '5173' }}" >> .env

            # Pull latest images from Amazon ECR and Docker Hub cleanly
            docker compose -f docker-compose.prod.yml pull

            # Deploy and start all services
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Configure Keycloak: Disable SSL requirement on master & dynamically register redirect URIs from EC2_HOST
            echo "Configuring Keycloak dynamic client redirect URIs for host: $TARGET_HOST ..."
            KC_USER="${{ secrets.KEYCLOAK_ADMIN || 'admin' }}"
            KC_PASS="${{ secrets.KEYCLOAK_ADMIN_PASSWORD || secrets.DB_PASSWORD }}"
            TARGET_ORIGIN="http://${TARGET_HOST}:5173"

            for i in {1..25}; do
              if docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "$KC_USER" --password "$KC_PASS" >/dev/null 2>&1 || \
                 docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password admin >/dev/null 2>&1 || \
                 docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password "${{ secrets.DB_PASSWORD }}" >/dev/null 2>&1; then
                # 1. Disable SSL requirement on master realm so external HTTP works
                docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE || true
                echo "Keycloak master realm SSL requirement successfully disabled."

                # 2. Look up the internal client UUID for oauth2-pkce-client and dynamically update origins
                CLIENT_UUID=\$(docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh get clients -r fitness-app -q clientId=oauth2-pkce-client --fields id --format csv --noquotes 2>/dev/null | tr -d '[:space:]"')
                if [ -n "\$CLIENT_UUID" ]; then
                  docker exec fitness-keycloak /opt/keycloak/bin/kcadm.sh update "clients/\$CLIENT_UUID" -r fitness-app \
                    -s "redirectUris=[\"$TARGET_ORIGIN/*\", \"$TARGET_ORIGIN\", \"http://localhost:5173/*\", \"http://localhost:5173\"]" \
                    -s "webOrigins=[\"$TARGET_ORIGIN\", \"+\"]" || true
                  echo "Successfully registered dynamic redirect URI for oauth2-pkce-client: $TARGET_ORIGIN/*"
                fi
                break
              fi
              echo "Waiting for Keycloak to finish starting..."
              sleep 3
            done

            # 5. Clean up old unused images
            docker image prune -f

            # 6. Verify container status
            docker compose -f docker-compose.prod.yml ps
          EOF